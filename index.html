<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retoque local · Diagnóstico</title>
<style>
body{font:1rem system-ui;background:#f5f1e9;color:#222c27;margin:0}
main{max-width:38rem;margin:12vh auto;padding:1.5rem}
h1{font-size:clamp(2rem,8vw,3.5rem);line-height:1.05}
button{padding:.8rem 1.2rem;background:#244e3e;color:white;border:0;border-radius:.5rem;font:inherit}
dd{margin:0 0 .8rem}dt{font-weight:700}p{line-height:1.5}
</style>
<main>
<h1>Diagnóstico de GPU</h1>
<p>Ejecuta una convolución sintética en cuatro tamaños hasta 2048 × 2048. El resultado muestra la mayor carga completada en esta prueba. La VRAM libre y el rendimiento de un modelo ONNX requieren mediciones distintas.</p>
<button id="run">Probar este dispositivo</button>
<p id="status" role="status"></p>
<dl id="result"></dl>
</main>
<script id="worker" type="text/plain">
const shader = `
@group(0) @binding(0) var<storage, read> input: array<f32>;
@group(0) @binding(1) var<storage, read_write> output: array<f32>;
@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) p: vec3u) {
  let width = arrayLength(&input);
  let side = u32(sqrt(f32(width)));
  let index = p.y * side + p.x;
  if (p.x == 0u || p.y == 0u || p.x + 1u >= side || p.y + 1u >= side) { return; }
  var sum = 0.0;
  for (var y = -1; y <= 1; y++) {
    for (var x = -1; x <= 1; x++) {
      sum += input[u32(i32(index) + y * i32(side) + x)];
    }
  }
  output[index] = max(0.0, sum / 9.0);
}`;

self.onmessage = async () => {
  let device, lost;
  const report = {};
  let lastPassed = null;
  try {
    const adapter = await navigator.gpu?.requestAdapter();
    if (!adapter) throw new Error('El navegador no ofreció un adaptador WebGPU.');
    device = await adapter.requestDevice();
    device.lost.then(info => { lost = info; });
    report['FP16 disponible'] = adapter.features.has('shader-f16') ? 'Sí' : 'No';
    const layout = 'auto';
    const module = device.createShaderModule({code: shader});
    const pipeline = await device.createComputePipelineAsync({layout, compute: {module, entryPoint: 'main'}});
    for (const side of [256, 512, 1024, 2048]) {
      const bytes = side * side * 4;
      if (bytes > Math.min(device.limits.maxBufferSize, device.limits.maxStorageBufferBindingSize)) break;
      const buffers = [];
      device.pushErrorScope('out-of-memory');
      device.pushErrorScope('validation');
      const start = performance.now();
      try {
        const input = device.createBuffer({size: bytes, usage: GPUBufferUsage.STORAGE});
        buffers.push(input);
        const output = device.createBuffer({size: bytes, usage: GPUBufferUsage.STORAGE});
        buffers.push(output);
        const bindGroup = device.createBindGroup({layout: pipeline.getBindGroupLayout(0), entries: [
          {binding: 0, resource: {buffer: input}},
          {binding: 1, resource: {buffer: output}}
        ]});
        const encoder = device.createCommandEncoder();
        const pass = encoder.beginComputePass();
        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bindGroup);
        pass.dispatchWorkgroups(side / 8, side / 8);
        pass.end();
        device.queue.submit([encoder.finish()]);
        await device.queue.onSubmittedWorkDone();
      } finally {
        buffers.forEach(buffer => buffer.destroy());
        const validation = device.popErrorScope();
        const memory = device.popErrorScope();
        const errors = await Promise.all([validation, memory]);
        const error = errors.find(Boolean);
        if (error) throw new Error(error.message);
      }
      if (lost) throw new Error('Se perdió el dispositivo WebGPU.');
      lastPassed = side;
      report[side + ' × ' + side] = (bytes * 2 / 1048576) + ' MiB en búferes · ' + Math.round(performance.now() - start) + ' ms';
      self.postMessage({progress: true, report});
    }
    self.postMessage({status: lastPassed ? 'Mayor carga completada: ' + lastPassed + ' × ' + lastPassed + '.' : 'El adaptador no admite la primera carga.', report});
  } catch (error) {
    const prefix = lastPassed ? 'Mayor carga completada: ' + lastPassed + ' × ' + lastPassed + '. ' : '';
    self.postMessage({status: prefix + (lost ? 'Se perdió el dispositivo WebGPU.' : error.message), report});
  } finally {
    device?.destroy();
  }
};
</script>
<script>
const button = document.querySelector('#run');
const status = document.querySelector('#status');
const result = document.querySelector('#result');
const storageKey = 'agarsito-gpu-convolution-v1';
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (saved) status.textContent = 'Última prueba: ' + saved.status;
} catch {}
button.onclick = () => {
  const url = URL.createObjectURL(new Blob([document.querySelector('#worker').textContent], {type: 'text/javascript'}));
  let worker, timeout, latestReport = {};
  button.disabled = true;
  result.replaceChildren();
  status.textContent = 'Probando WebGPU…';
  function finish(message, report = {}) {
    clearTimeout(timeout);
    worker?.terminate();
    URL.revokeObjectURL(url);
    status.textContent = message;
    for (const [label, value] of Object.entries(report)) {
      const term = document.createElement('dt');
      const detail = document.createElement('dd');
      term.textContent = label;
      detail.textContent = value;
      result.append(term, detail);
    }
    button.disabled = false;
  }
  try {
    worker = new Worker(url);
    worker.onmessage = ({data}) => {
      latestReport = data.report;
      if (data.progress) {
        status.textContent = 'Cargas completadas: ' + (Object.keys(latestReport).length - 1);
        return;
      }
      try { localStorage.setItem(storageKey, JSON.stringify({status: data.status})); } catch {}
      finish(data.status, data.report);
    };
    worker.onerror = () => finish('El navegador no pudo ejecutar el diagnóstico.');
    timeout = setTimeout(() => finish('La prueba superó los 12 segundos.', latestReport), 12000);
    worker.postMessage(null);
  } catch {
    finish('El navegador no pudo iniciar el diagnóstico.');
  }
};
</script>
</html>
